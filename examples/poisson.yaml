# ============================================================
# YMF Example: Poisson on unit square (v0.1-compatible)
# ============================================================

Problem:
  name: "Poisson unit square"
  physical_model:
    provenance: llm_derived
    processes: [heat_conduction]
    assumptions: [steady, constant_properties]

  # Machine-readable domain, equations, conditions and solution: these are
  # what ymf.symbolic reads to run the problem (see ymf_run in Proteus).
  geometry:
    box: {lower: [0.0, 0.0], upper: [1.0, 1.0]}

  strong_form:
    provenance: llm_derived
    unknowns: [u]
    equation_formulation: "Poisson"
    strong_form_expression: |-
      -Δu = f  in Ω
    domain: |-
      Ω = [0,1] × [0,1]
    boundary_regions:
      - name: "all_boundaries"
        geometry: "∂Ω"
    boundary_conditions:
      - region: "all_boundaries"
        variable: u
        type: dirichlet
        value: 0.0
    coefficients:
      f: {formula: "pi**2*sin(pi*x)*sin(pi*y)"}
    equations:
      - "-div(grad(u)) = f"

  weak_forms:
    - label: "global"
      provenance: llm_derived
      derivation: |-
        Multiply by test function v ∈ H1_0(Ω),
        integrate over Ω, integrate by parts.
      solution_spaces:
        trial: "H1"
        test: "H1_0"
      inf_sup_stability: "true"
      existence_note: "Lax-Milgram applies (coercive bilinear form)"
      uniqueness_note: "guaranteed by coercivity"
      regularity_note: "u ∈ H2(Ω) on convex domain"
      bilinear: |-
        a(u,v) = ∫Ω ∇u·∇v dx
      linear: |-
        l(v) = ∫Ω f·v dx
      boundary_conditions: |-
        u|∂Ω = 0  (essential)
      stabilization_method: "none"

solution_paths:
  analytical:
    - name: "exact_Poisson"
      # The LLM-derived formula was sin(πx)sin(πy)/(2π²), which does not
      # satisfy -Δu = f: -Δ(sin(πx)sin(πy)) = 2π² sin(πx)sin(πy), so with
      # f = π² sin(πx)sin(πy) the solution is half of sin(πx)sin(πy). The
      # end-to-end run exposed it: the error plateaued at exactly
      # (1/2 - 1/(2π²))/2 = 0.2247 on every mesh.
      provenance: human_edited
      method: "separation_of_variables"
      solution:
        formula: |-
          u(x,y) = sin(πx)sin(πy) / 2
        expressions:
          u: "sin(pi*x)*sin(pi*y)/2"
        derivation_source: "sympy.dsolve"

  discretizations:
    - name: "P1_linear"
      provenance: llm_derived
      from_weak_form: "global"
      finite_element:
        fields: {family: CG, order: 1}
      solver:
        type: linear
        linear_solver: petsc
        tolerance: 1.0e-12

    - name: "P2_quadratic"
      provenance: human_specified
      from_weak_form: "global"
      finite_element:
        fields: {family: CG, order: 2}
      solver:
        type: linear
        linear_solver: petsc
        tolerance: 1.0e-12
