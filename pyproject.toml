[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ymf"
dynamic = ["version"]
description = "YAML Modeling Format for computational physics — problem specification, VVUQ, and multi-backend dispatch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cekees" }]
# Core runtime dependency, kept to exactly one on purpose: a solver that
# writes YMF archives (see ymf.archive) must not inherit the validation
# stack. Everything heavier sits behind the extras below, which only the
# validating front-end installs.
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
# Converts a .ymf archive to the .xmf a viewer reads. In the core, so it
# works without the ymf[spec] validation stack.
ymf2xmf = "ymf.cli:ymf2xmf_main"

[project.optional-dependencies]
# strictyaml-backed schema validation of human/LLM-authored YMF input.
spec = ["strictyaml>=1.7"]
# pint-backed unit coherence and dimensional analysis.
units = ["pint>=0.23"]
# ymf.symbolic: machine-readable equations -> advection-diffusion-reaction
# forms for solvers. Its output is plain data, so solvers need none of this.
symbolic = ["sympy>=1.12", "strictyaml>=1.7"]
# Everything the validating front-end needs.
frontend = ["strictyaml>=1.7", "pint>=0.23"]
# What examples/write_archive.py and read_archive.py need to make and read
# the HDF5 side of an archive. A solver brings its own.
examples = ["numpy", "h5py"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "strictyaml>=1.7",
    "pint>=0.23",
    "numpy",
    "h5py",
    "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
