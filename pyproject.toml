[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ymf"
dynamic = ["version"]
description = "YAML Modeling Format for computational physics — problem specification, VVUQ, and multi-backend dispatch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cekees" }]
dependencies = [
    "strictyaml>=1.7",
    "sympy>=1.12",
    "pint>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
